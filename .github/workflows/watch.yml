name: CGV 예매 오픈 감시

# 자동 실행은 껐다. 로컬에서 run_local.bat 으로 상주시키는 쪽이
# 응답이 즉각적이고, GitHub 러너를 24시간 점유하지 않아도 된다.
# 아래 schedule 을 다시 살리면 예전처럼 GitHub 에서 돌릴 수 있다.
#
#   schedule:
#     - cron: "*/5 * * * *"
#
# 지금은 Actions 탭에서 Run workflow 를 눌렀을 때만 돈다.
on:
  workflow_dispatch:

concurrency:
  # 돌고 있는 잡은 건드리지 않고 다음 잡을 대기열에 세운다. 한 그룹에
  # 대기는 한 건만 남으므로, 크론이 몇 번을 깨우든 "실행 중 1 + 대기 1" 이
  # 유지되고, 앞 잡이 끝나는 즉시 뒤 잡이 이어받아 감시가 끊기지 않는다.
  group: cgv-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 예매 오픈 확인 (30초마다, 55분간)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cgv_watch.py --loop --interval 30 --jitter 0.4 --duration 3300

      - name: 상태 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 상영 회차 상태 갱신 [skip ci]"
            git pull --rebase --autostash
            git push
          fi
