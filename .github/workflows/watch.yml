name: CGV 예매 오픈 감시

on:
  schedule:
    # GitHub 크론의 최소 간격은 5분이라 더 짧게 적어도 무시된다.
    # 대신 잡 하나가 4분 동안 30초마다 확인하며 살아 있어서, 실질 감지 주기는 30초다.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # 밀린 실행을 취소하지 않고 줄 세운다. 러너가 붐벼 크론이 밀려도
  # 대기 중이던 잡들이 이어서 돌면서 빈 시간을 메운다.
  group: cgv-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 예매 오픈 확인 (30초마다, 4분간)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cgv_watch.py --loop --interval 30 --jitter 0.4 --duration 240

      - name: 상태 저장
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 상영 회차 상태 갱신 [skip ci]"
            git pull --rebase --autostash
            git push
          fi
